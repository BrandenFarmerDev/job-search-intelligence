name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "bfarmer/**"]
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy the reviewed branch to the synthetic-data preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="gitleaks_8.29.1_linux_x64.tar.gz"
          curl --fail --show-error --silent --location "https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/$archive" --output "$RUNNER_TEMP/$archive"
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  $RUNNER_TEMP/$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "GITLEAKS_BINARY=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Set up official CodeQL CLI
        id: codeql
        uses: github/codeql-action/setup-codeql@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - run: npm run quality
        env:
          CODEQL_BINARY: ${{ steps.codeql.outputs.codeql-path }}
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            app/*/coverage/
            packages/*/coverage/
            coverage/
            reports/jscpd/
            reports/security/
            reports/codeql-*/source.sarif
          retention-days: 14

  deploy:
    name: Deploy application
    needs: quality
    if: >-
      vars.ENABLE_DEPLOYMENTS == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_preview && startsWith(github.ref, 'refs/heads/bfarmer/')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    concurrency:
      group: job-search-${{ github.event_name == 'push' && 'production' || 'preview' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      WRANGLER_SEND_METRICS: "false"
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Block unconfigured or shared resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'configured' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'configured' || '' }}
        run: node scripts/validate-deployment.mjs "$DEPLOY_ENVIRONMENT"
      - name: Validate Worker bundle and build frontend
        run: |
          npm run "build:$DEPLOY_ENVIRONMENT" --workspace @job-search/backend
          npm run build --workspace @job-search/frontend
      - name: Apply additive D1 migrations and deploy Worker
        working-directory: app/backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply JOB_SEARCH_DB --remote --env "$DEPLOY_ENVIRONMENT"
          npx wrangler deploy --env "$DEPLOY_ENVIRONMENT"
      - name: Upload Pages frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then PAGES_BRANCH=main; else PAGES_BRANCH=preview; fi
          npx wrangler pages deploy app/frontend/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$PAGES_BRANCH"
      - name: Verify unauthenticated site and API are protected
        run: node scripts/check-private-deployment.mjs
