name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "bfarmer/**"]
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy the reviewed branch to the synthetic-data preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run quality
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            app/*/coverage/
            packages/*/coverage/
            coverage/
            reports/jscpd/
          retention-days: 14

  deploy:
    name: Deploy application
    needs: quality
    if: >-
      vars.ENABLE_DEPLOYMENTS == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_preview && startsWith(github.ref, 'refs/heads/bfarmer/')))
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    permissions:
      contents: read
      deployments: write
