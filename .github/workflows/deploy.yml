name: Deploy reviewed artifacts

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  cloudflare:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    concurrency:
      group: job-search-${{ inputs.target }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.target }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Block unconfigured or shared resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'configured' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'configured' || '' }}
        run: node scripts/validate-deployment.mjs "$DEPLOY_ENVIRONMENT"
      - name: Validate Worker bundle and build frontend
        run: |
          npm run "build:$DEPLOY_ENVIRONMENT" --workspace @job-search/backend
          npm run build --workspace @job-search/frontend
      - name: Apply additive D1 migrations and deploy Worker
        working-directory: app/backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply JOB_SEARCH_DB --remote --env "$DEPLOY_ENVIRONMENT"
          npx wrangler deploy --env "$DEPLOY_ENVIRONMENT"
      - name: Upload Pages frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then PAGES_BRANCH=main; else PAGES_BRANCH=preview; fi
          npx wrangler pages deploy app/frontend/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$PAGES_BRANCH"
      - name: Verify unauthenticated site and API are protected
        run: node scripts/check-private-deployment.mjs
